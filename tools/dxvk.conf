# DXVK tuning for Fable III. Replaces the config shipped with Fable III Ultimate Perf.
#
# Fable3.exe is a 32-bit process, so its whole address space is ~2 GB (~4 GB with a LAA
# patch, and the community 4GB patch is no longer available on Nexus). Running D3D9 through
# Vulkan already helps, because the Vulkan driver keeps far less mapped in the game's own
# address space than a native D3D9 driver does. The memory keys below exist to stop the game
# allocating its way back into a crash.

# What the game is TOLD it has. The engine sizes its texture pools from this, so an honest
# 8 GB answer makes a 32-bit process allocate itself to death. Capping it is the single most
# useful setting here. Raise toward 2048 only if textures visibly pop or degrade.
d3d9.maxAvailableMemory = 1536

# Keep DXVK's own budget clear of the game's address space, and let it defragment rather
# than fail an allocation after a few hours of play.
dxvk.maxMemoryBudget = 1024
dxvk.enableMemoryDefrag = True

# One frame of queued work: lowest input lag, and this game is not GPU bound on anything
# modern. Raise to 2 only if the frame pacing feels uneven.
d3d9.maxFrameLatency = 1

# Old D3D9 titles write dynamic buffers constantly; caching them in host memory avoids a
# round trip per update.
d3d9.cachedDynamicBuffers = True

# Free image quality: the game never asks for anisotropic filtering, so force it.
d3d9.samplerAnisotropy = 16

# ALT-TAB. Native D3D9 "loses" the device when a fullscreen app loses focus, and the game
# drives its alt-tab handling off exactly that signal. DXVK does not report device loss by
# default, so Fable III never learns it lost focus and alt-tab stops working. Turning this
# on restores the native behaviour. Removing DXVK entirely also fixes alt-tab, which is what
# identified this as the cause.
d3d9.deviceLossOnFocusLoss = True

# NOT SET, deliberately:
#
# d3d9.forceRefreshRate - the shipped config pinned this to 170, which only applies in
#   exclusive fullscreen and is specific to that author's monitor. Exclusive fullscreen is
#   also where alt-tab breaks. Leave it to Windows, and prefer running the game windowed or
#   borderless if alt-tab still misbehaves.
#
# d3d9.presentInterval - leave the in-game vsync setting in charge instead of overriding it.
#
# dxgi.* - this game is D3D9 only. Those keys do nothing here and the shipped config set
#   two of them.
